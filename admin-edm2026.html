<style>
html,body{margin:0;height:100%;background:#0b1020;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}.box{background:#151c31;border:1px solid #2b3556;border-radius:14px;padding:22px;max-width:360px;width:100%;box-sizing:border-box}h1{font-size:20px;margin:0 0 8px;text-align:center}p{font-size:13px;color:#aab2c8;margin:0 0 16px;text-align:center}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#aab2c8;margin-bottom:5px}.field input{width:100%;box-sizing:border-box;border:1px solid #2b3556;background:#0d1425;color:#fff;border-radius:9px;padding:11px 12px;font-size:15px}.btn{width:100%;border:0;border-radius:9px;padding:11px 12px;background:#148b70;color:#fff;font-weight:800;font-size:14px;margin-top:8px}.btn:disabled{opacity:.6}.msg{min-height:20px;font-size:12px;text-align:center;margin-top:12px;color:#ffb4b4}.ok{color:#8be0c5}

/* Pointer cursor only on active interactive elements, not on decorative text. */
a[href],
button:not(:disabled),
[role="button"]:not([aria-disabled="true"]),
[onclick]:not(:disabled),
label[for],
label:has(input[type="checkbox"]:not(:disabled)),
label:has(input[type="radio"]:not(:disabled)),
input:is([type="checkbox"],[type="radio"],[type="range"],[type="submit"],[type="button"],[type="reset"]):not(:disabled),
select:not(:disabled),
summary {
  cursor: pointer !important;
}
button:disabled,
input:disabled,
select:disabled,
[aria-disabled="true"] {
  cursor: not-allowed !important;
}

<body>
<div class="wrap"><div class="box">
<h1>AI Football Live Admin</h1>
<p>Oyun için oluşturulan admin e-posta adresin ve şifrenle giriş yap. GitHub / Supabase panel girişi ayrıdır.</p>
<section id="profile" hidden><p><strong>Hesabım</strong></p><p id="profileEmail" style="overflow-wrap:anywhere"></p><p>Yetki: Admin</p><a class="btn" href="./admin-security.html">İki aşamalı doğrulama</a><a class="btn" href="./live.html" style="display:block;box-sizing:border-box;text-align:center;text-decoration:none">Oyuna dön</a><button id="logoutBtn" class="btn" type="button" style="background:#a43c50">Çıkış yap</button></section>
<form id="loginForm">
<div class="field"><label for="email">E-posta</label><input id="email" type="email" autocomplete="username" required></div>
<div class="field"><label for="password">Şifre</label><input id="password" type="password" autocomplete="current-password" required></div>
<button id="loginBtn" class="btn" type="submit">Giriş yap</button>
</form><p style="margin-top:16px"><a href="./live.html" style="color:#8be0c5">Oyunu izle</a></p><div id="msg" class="msg" role="status" aria-live="polite"></div><button id="retryConnection" class="btn" type="button" hidden>BAĞLANTIYI YENİDEN KONTROL ET</button>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://xozzbaguihyhruloiqjm.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_Oftm7DRbr0Vdt9gTLFGAaw_LQq4PCnP';
const ADMIN_UID='6893f884-6b91-4224-abaa-43f87df0966f';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const form=document.getElementById('loginForm'),btn=document.getElementById('loginBtn'),msg=document.getElementById('msg');
let quotaBlocked=false;
let resumeBusy=false,profileGeneration=0,profileRetry=null,logoutRequested=false;
function show(text,ok=false){msg.textContent=text;msg.className='msg'+(ok?' ok':'')}
function quotaError(error){return Number(error?.status)===402||/exceed_egress_quota|restricted due to|egress.*quota/i.test(String(error?.message||''));}
function showQuotaBlock(){quotaBlocked=true;btn.disabled=true;clearTimeout(profileRetry);document.getElementById('retryConnection').hidden=false;show('Giriş servisi veri aktarım kotası dolduğu için kısıtlı. Bu hata şifreden kaynaklanmıyor. Kota yenilendiğinde veya plan/kota artırıldığında giriş yeniden açılır.');}
async function checkAvailability(){try{const response=await fetch(SUPABASE_URL+'/auth/v1/health',{headers:{apikey:SUPABASE_PUBLISHABLE_KEY},cache:'no-store'});if(response.status===402){showQuotaBlock();return false;}}catch{}quotaBlocked=false;btn.disabled=false;document.getElementById('retryConnection').hidden=true;return true;}
async function finishIfAdmin(user){
 if(!user||user.id!==ADMIN_UID||logoutRequested)return false;
 if(resumeBusy)return true;resumeBusy=true;
 try{
 // A browser storage flag is not device authentication. Recheck via the Auth server.
 const {data,error}=await db.auth.getUser();
 if(error||data?.user?.id!==ADMIN_UID){if(quotaError(error))showQuotaBlock();else show('Kimlik doğrulaması teyit edilemedi.');return false;}
 const {data:mfa,error:mfaError}=await db.auth.mfa.getAuthenticatorAssuranceLevel();
 if(mfaError){show('İki aşamalı doğrulama kontrol edilemedi.');return false;}
 if(mfa?.currentLevel!=='aal2'){location.replace('./admin-security.html');return true;}
 const device=await db.rpc('admin_device_status');
 if(device.error||typeof device.data?.enabled!=='boolean'){show('Cihaz güvenliği doğrulanamadı. Tekrar dene.');return false;}
 if(device.data.enabled&&!device.data.approved){location.replace('./admin-devices.html');return true;}
 show('Giriş başarılı. Oyun açılıyor…',true);
 const next=new URLSearchParams(location.search).get('next');setTimeout(()=>{if(!logoutRequested)location.replace(next==='settings'?'./live.html#admin':next==='security'?'./admin-security.html':'./live.html');},350);return true;
 }catch{show('Oturum bağlantısı bekleniyor. Tekrar denenecek.');return false;}finally{resumeBusy=false;}
}
function showProfile(user){const isAdmin=!!(user&&user.id===ADMIN_UID);form.hidden=isAdmin;document.getElementById('profile').hidden=!isAdmin;document.getElementById('profileEmail').textContent=isAdmin?(user.email||'Admin hesabı'):'';}
async function checkProfile(){
 if(quotaBlocked)return;
 const generation=++profileGeneration;clearTimeout(profileRetry);
 try{
  const {data,error}=await db.auth.getUser();if(generation!==profileGeneration||logoutRequested)return;
  if(error){if(quotaError(error)){showQuotaBlock();return;}if([400,401,403].includes(Number(error.status))){showProfile(null);show('Oturum sona ermiş. Yeniden giriş yap.');return;}show('Oturum bağlantısı bekleniyor…');profileRetry=setTimeout(checkProfile,3000);return;}
  showProfile(data?.user);
  if(data?.user?.id===ADMIN_UID&&new URLSearchParams(location.search).get('next')==='settings'){
   if(!await finishIfAdmin(data.user)&&!quotaBlocked)profileRetry=setTimeout(checkProfile,3000);
  }
 }catch{if(generation===profileGeneration&&!logoutRequested){show('Oturum bağlantısı bekleniyor…');profileRetry=setTimeout(checkProfile,3000);}}
}
checkAvailability().then(ready=>{if(ready)checkProfile();});
document.getElementById('retryConnection').addEventListener('click',async()=>{show('Bağlantı kontrol ediliyor…');if(await checkAvailability())checkProfile();});
db.auth.onAuthStateChange((event,session)=>{
 if(event==='SIGNED_OUT'){logoutRequested=true;profileGeneration++;clearTimeout(profileRetry);showProfile(null);return;}
 // Revalidate the stored session without clearing the profile during refresh.
 if(session){logoutRequested=false;setTimeout(checkProfile,0);}
});
window.addEventListener('online',()=>{if(!logoutRequested)checkProfile();});
window.addEventListener('pageshow',()=>{if(!logoutRequested)checkProfile();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!logoutRequested)checkProfile();});

document.getElementById('logoutBtn').addEventListener('click',async()=>{const logout=document.getElementById('logoutBtn');logout.disabled=true;logoutRequested=true;profileGeneration++;clearTimeout(profileRetry);try{const {error}=await db.auth.signOut({scope:'local'});if(error)throw error;showProfile(null);document.getElementById('password').value='';show('Bu tarayıcıdaki oturum kapatıldı.',true);}catch(e){logoutRequested=false;show('Çıkış yapılamadı. Tekrar dene.')}finally{logout.disabled=false}});
form.addEventListener('submit',async e=>{e.preventDefault();if(quotaBlocked)return;logoutRequested=false;btn.disabled=true;show('Giriş yapılıyor…');const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;const {data,error}=await db.auth.signInWithPassword({email,password});if(error){if(quotaError(error)){showQuotaBlock();return;}show(Number(error.status)===429?'Çok fazla giriş denemesi yapıldı. Biraz bekleyip tekrar dene.':Number(error.status)>=500?'Giriş servisine ulaşılamıyor. Biraz sonra tekrar dene.':'Giriş başarısız: e-posta veya şifreyi kontrol et.');btn.disabled=false;return}if(!data.user||data.user.id!==ADMIN_UID){await db.auth.signOut({scope:'local'});show('Bu hesap admin olarak yetkili değil.');btn.disabled=false;return}if(!await finishIfAdmin(data.user))btn.disabled=quotaBlocked});
</script>
</body>
</html>
